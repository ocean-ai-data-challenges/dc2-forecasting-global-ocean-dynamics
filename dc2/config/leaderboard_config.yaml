# =============================================================================
# DC Leaderboard — Configuration file
# =============================================================================
# Place this file in your results/ directory (or its parent).
# It will be auto-detected when building the leaderboard, or you can pass it
# explicitly with:
#   python run_local.py --config path/to/leaderboard_config.yaml
#   dcleaderboard-build --results-dir results/ --output-dir _site/ --config leaderboard_config.yaml
#
# All sections are optional. Only the keys you specify are overridden;
# everything else falls back to the built-in defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# A. Page-level text
# -----------------------------------------------------------------------------
texts:
  # Title shown in the browser tab and hero section
  page_title: "Data Challenge 2 — Leaderboard"

  # Brand name and subtitle in the top navigation bar
  brand_name: "Ocean & Climate"
  brand_sub: "Data Challenge"

  # URL linked from the navbar GitHub icon and the About page: the challenge's repository
  github_url: "https://github.com/ocean-ai-data-challenges/dc2-forecasting-global-ocean-dynamics"
  # The documentation (rules, data, metrics, submission), linked from the hero and the footer
  docs_url: "https://dc2-forecasting-global-ocean-dynamics.readthedocs.io/"

  footer_text: "An open benchmark for evaluating ocean forecasting models, maintained by IMT
    Atlantique, with the support of Ifremer's Datarmor computing centre."
  about_how_it_works: "Forecasts are scored against independent observations (along-track and
    SWOT altimetry, SST, SSS, Argo profiles and float velocities, drifters) and against the
    GLORYS12 reanalysis, per variable, depth and lead day. An ensemble is scored by its mean (the
    deterministic scores) and by its members (CRPS, spread, spread-skill ratio). The colours
    compare each model with the period's reference model: <strong style=\"color:#1a73e8;\">blue
    = better</strong>, <strong style=\"color:#c53929;\">red = worse</strong>; for a bias or a
    ratio, better is closer to its target (0, 1). Lead day 0 (the initialisation day) is shown
    but not an independent score: the observations of that day may have been assimilated in the
    initial state. Two views: 2024, the period of every baseline, and 2023-2024, the whole
    evaluation period, for the models that cover it."
  about_participating: "Want to add your model? The <a
    href=\"https://dc2-forecasting-global-ocean-dynamics.readthedocs.io/\" target=\"_blank\">documentation</a>
    gives the rules on the data a forecast may use, the submission format and the evaluation
    code (<a href=\"https://github.com/ocean-ai-data-challenges/dc2-forecasting-global-ocean-dynamics\"
    target=\"_blank\">repository</a>)."
  about_supporters: "DC2 is part of the PPR Océan &amp; Climat (CNRS / Ifremer). It is maintained
    by IMT Atlantique; the baselines are evaluated on Ifremer's Datarmor computing centre."
  period_switch_label: "Evaluation period"
  excluded_text: "not shown: does not cover the period"

  # Section-header templates.
  # Available placeholders are shown between {}.
  reference_header: "## Reference Dataset: {ref_alias}"
  metric_header: "### Metric: {metric_name}"
  variable_group_header: "#### Variable Type: {var_type}"
  period_header: "Compared period"
  legend_label: "Error relative to GloNet (%): blue better, red worse"

# -----------------------------------------------------------------------------
# B. Metric display names
# Map internal metric key  human-readable label shown in the leaderboard tables.
# Only metrics listed here are renamed; others keep their original names.
# -----------------------------------------------------------------------------
metrics_names:
  rmse: "Root Mean Squared Error (RMSE)"
  rmsd: "Root Mean Squared Deviation (RMSD)"
  bias: "Bias"
  rmsd_geostrophic_currents: "RMSD — Geostrophic Currents"
  rmsd_mld: "RMSD — Mixed Layer Depth"
  lagrangian: "Lagrangian Analysis"
  mae: "Mean Absolute Error (MAE)"
  me: "Mean Error (ME)"
  crmse: "Centred RMSD (bias removed)"
  count: "Number of observations"
  mse: "Mean Squared Error (MSE)"
  # ensemble forecasts
  crps: "CRPS (fair)"
  crps_c: "CRPS, bias removed"
  spread: "Ensemble spread"
  ssr: "Spread-skill ratio"
  ssr_c: "Spread-skill ratio, bias removed"
  # energy by band of scales, against GLORYS (any forecast; the mean only for ensembles)
  energy_ratio_gt500km: "Energy ratio, > 500 km (members)"
  energy_ratio_200_500km: "Energy ratio, 200–500 km (members)"
  energy_ratio_100_200km: "Energy ratio, 100–200 km (members)"
  energy_ratio_lt100km: "Energy ratio, < 100 km (members)"
  energy_ratio_mean_gt500km: "Energy ratio, > 500 km (ensemble mean)"
  energy_ratio_mean_200_500km: "Energy ratio, 200–500 km (ensemble mean)"
  energy_ratio_mean_100_200km: "Energy ratio, 100–200 km (ensemble mean)"
  energy_ratio_mean_lt100km: "Energy ratio, < 100 km (ensemble mean)"
  err_ratio_gt500km: "Error / signal, > 500 km"
  err_ratio_200_500km: "Error / signal, 200–500 km"
  err_ratio_100_200km: "Error / signal, 100–200 km"
  err_ratio_lt100km: "Error / signal, < 100 km"

# -----------------------------------------------------------------------------
# C. Variable display names
# The variables of every table are "<depth> <name>" ("Surface ssh", "50m u_current"): the names
# below translate the <name> part (the depth is kept). Gridded (GLORYS) and observation scores
# use the same names.
# -----------------------------------------------------------------------------
variables_names:
  ssh: "Sea surface height (SSH)"
  temperature: "Temperature"
  salinity: "Salinity"
  u_current: "Eastward velocity (U)"
  v_current: "Northward velocity (V)"
  sst: "Sea surface temperature (SST)"
  sss: "Sea surface salinity (SSS)"
  mld: "Mixed layer depth (MLD)"

# -----------------------------------------------------------------------------
# D. Model / dataset display names
# Map internal model identifier  human-readable name shown in the row labels.
# -----------------------------------------------------------------------------
models_names:
  glonet: "GloNet"
  glo4ens: "GLO4ENS (Mercator ensemble)"

# -----------------------------------------------------------------------------
# E. What the tables show
# -----------------------------------------------------------------------------
# The metrics shown, in this order (the others -- mse, me, count -- are left out). Without this
# list, dctools builds one from the sources' `metrics:` (rmsd, mae), which hid crmse, bias and the
# ensemble scores of the observation tables.
allowed_metrics:
  - rmse                      # against observations
  - rmsd                      # against GLORYS
  - crmse                     # the SSH score (the reference-surface offset removed)
  - bias
  - mae
  - crps
  - crps_c
  - spread
  - ssr
  - ssr_c
  - energy_ratio_gt500km
  - energy_ratio_200_500km
  - energy_ratio_100_200km
  - energy_ratio_lt100km
  - energy_ratio_mean_gt500km
  - energy_ratio_mean_200_500km
  - energy_ratio_mean_100_200km
  - energy_ratio_mean_lt100km
  - err_ratio_gt500km
  - err_ratio_200_500km
  - err_ratio_100_200km
  - err_ratio_lt100km

# The model the others are coloured against.
reference_model: glonet

# Within a view, scores are means over the forecasts initialised in the period every model covers:
# a table compares like with like. Each model's period and the number of forecasts kept are shown
# above the tables.
common_period: true

# Two views of the tables, with a switch: 2024, the period of every baseline (GloNet's forecasts
# cover 2024 only: it was trained with data up to 2023), and 2023-2024, the whole evaluation period,
# for the models that cover it (GLO4ENS, then the reference). A view keeps the models whose
# forecasts cover its period, then their common period.
periods:
  - key: "2024"
    label: "2024 (all baselines)"
    start: "2024-01-01"
    end: "2024-12-31"
    description: "Forecasts initialised in 2024: every baseline, GloNet the reference."
  - key: "2023_2024"
    label: "2023-2024"
    start: "2023-01-01"
    end: "2024-12-31"
    description: "The whole evaluation period, for the models whose forecasts cover it; GLO4ENS
      is the reference."
    config:
      reference_model: glo4ens
      texts:
        legend_label: "Error relative to GLO4ENS (%): blue better, red worse"

# Maps: one depth level at a time (no map averaged over levels as different as 0 and 1000 m).
maps:
  all_depths_option: false

# Lead days: numbered from 0 (lead 0 is the initialisation day, published but not ranked: rule 3)
# and spread from the first to the last of the horizon (n_days_forecast).
lead_days:
  zero_based: true
  mode: spread
  max_count: 5

# Colours: an error (default) is better lower; a bias or a ratio closer to its target (bias 0,
# ssr 1, energy_ratio 1); a spread, a count or the ensemble mean's energy have no better side.
# Defaults are in dcleaderboard (DEFAULT_METRIC_TARGETS); override here:
# metrics_targets:
#   bias: 0
