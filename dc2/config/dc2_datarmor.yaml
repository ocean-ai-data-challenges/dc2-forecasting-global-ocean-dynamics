# DC2 on Datarmor (Ifremer): the EDITO profile, its parallelism sized for the jobs' node share
# (scripts/datarmor/*.sbatch: 24 CPUs, 96 GB) instead of a 30 GB machine. Not a full config:
# scripts/datarmor/site_config.py writes base + these overrides into the job's work directory.
# The workers take at most 48 GB and 18 threads (argo_profiles, swot): the rest is the driver's
# (its download threads; up to ~20 GB of results held at once) and the system's.
base: dc2_edito.yaml

sources:                      # by dataset; fields not named keep the base's values
  nadir_l3:        {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}         # 8×2 threads, 32 GB
  SST_fields:      {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}
  SSS_fields:      {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}
  drifters_15m:    {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}
  argo_profiles:   {n_parallel_workers: 12}                                        # 12×1 thread, 48 GB
  # the base's limits came from a driver holding a 537k-point file per task, before the ±12 h
  # window: a task now has a few hundred points
  argo_velocities: {n_parallel_workers: 6, obs_batch_size: 12}                     # 6×1 thread, 24 GB
  swot:            {n_parallel_workers: 6}                                         # 6×(1+2 C++) threads, 36 GB
  glorys:          {n_parallel_workers: 3}       # not more: the shared MinIO gateway throttles (base)
  glonet:          {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}
  glo4ens:         {n_parallel_workers: 8, memory_limit_per_worker: "4GB"}
